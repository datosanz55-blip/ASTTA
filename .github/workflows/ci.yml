name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: astta
          POSTGRES_USER: astta
          POSTGRES_PASSWORD: astta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: astta
      POSTGRES_USER: astta
      POSTGRES_PASSWORD: astta
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations are up to date
        run: DJANGO_DEBUG=1 python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
