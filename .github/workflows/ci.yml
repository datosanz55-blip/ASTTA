name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: astta
          POSTGRES_USER: astta
          POSTGRES_PASSWORD: astta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: astta
      POSTGRES_USER: astta
      POSTGRES_PASSWORD: astta
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations are up to date
        run: DJANGO_DEBUG=1 python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
      - name: Production settings pass Django deploy checks
        run: >-
          DJANGO_DEBUG=0 DJANGO_ALLOWED_HOSTS=astta.ru
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING
      - name: No known vulnerabilities in dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose is valid
        run: cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.yml --env-file infra/.env config --quiet
      - name: Caddyfile is valid
        run: >-
          docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e SITE_DOMAIN=astta.ru -e ACME_EMAIL=ops@astta.ru -e DJANGO_ADMIN_URL=team-test
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
